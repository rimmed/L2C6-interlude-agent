# ---------------------------------------------------------------------------
# RL Agent Environment
# ---------------------------------------------------------------------------
# Turns the server into a training environment for autonomous combat agents:
# agent characters are created, levelled, promoted, equipped, supplied and
# sent to a farm zone that fits their level, and they are revived in that zone
# instead of being sent to town when they die.
#
# All delays are server timer delays, so they are divided by TimeScale
# (General.ini) like every other server timer.

# Master switch. False = completely standard server behaviour.
# Default: False
EnableRLAgentAutoSetup = True

# ---------------------------------------------------------------------------
# Which characters are agents
# ---------------------------------------------------------------------------

# Regular expression an account name must fully match for its characters to be agents.
# Examples: .* (every account), (rl|bot).* (accounts starting with "rl" or "bot").
# Default: .*
RLAgentAccountPattern = rl.*

# Characters created while the system is enabled are always marked as agents.
# True also treats characters that existed before as agents (they are boosted,
# re-equipped and teleported on their next login).
# Default: False
RLApplyToExistingCharacters = False

# ---------------------------------------------------------------------------
# Character creation
# ---------------------------------------------------------------------------

# When an agent account with no characters logs in, create one automatically
# (random race/base class, random appearance, generated unique name), so a
# headless client can pick slot 0 without going through character creation.
# Default: True
RLAutoCreateCharacter = True

# Name prefixes for generated names; a random alphanumeric suffix is appended.
# The server only accepts alphanumeric names, so characters such as "_" are dropped.
# Default: Bot,Agent,RL
RLNamePrefixes = Bot,Agent,RL

# Length of the random suffix (names are at most 16 characters).
# Default: 6
RLNameSuffixLength = 6

# ---------------------------------------------------------------------------
# Levelling and progression
# ---------------------------------------------------------------------------

# On its first login every agent is boosted to a random level in [RLMinLevel, RLMaxLevel].
# Agents that are already above the drawn level keep their level.
# Default: 1, 80
RLMinLevel = 1
RLMaxLevel = 80

# The level is drawn from a normal (Gaussian) distribution with this mean and standard
# deviation, cut to [RLMinLevel, RLMaxLevel]: with 40 and 15 about 68 % of the agents are
# level 25-55 and about 2 % level 70-80. RLLevelStdDev = 0 draws uniformly instead.
# Default: 40, 15
RLLevelMean = 40
RLLevelStdDev = 15

# Learn every class skill available for the current level automatically
# (on setup and on every level-up), without visiting a trainer.
# Default: True
RLAutoLearnSkills = True

# Perform the 1st (level 20), 2nd (level 40) and 3rd (level 76) class transfer
# automatically, choosing a random class of the character's class tree.
# Default: True
RLAutoClassTransfer = True

# ---------------------------------------------------------------------------
# Equipment and supplies
# ---------------------------------------------------------------------------

# Equip a full set of grade-appropriate weapon and armor that fits the class
# (robes and a magic weapon for mages, light armor and a bow/dagger/fist weapon
# for archers/daggers/monks, heavy armor with sword/blunt and shield otherwise).
# The set is replaced when a level-up reaches a new grade. Within a grade the
# pieces are chosen at random, which spreads the gear distribution.
# Default: True
RLAutoEquip = True

# Level at which each grade starts; below the first entry No-Grade is used.
# The defaults are the grade levels of the game (the level from which a grade
# can be worn without penalty). B, A and S sets are only reached by agents whose
# level gets that high, so raise RLMaxLevel to boost agents straight into them.
# "Sealed" A/S pieces are skipped, so a set always has its set bonus.
# Format: grade:level;grade:level  (grades: D, C, B, A, S)
# Default: D:20;C:40;B:52;A:61;S:76
RLGradeLevels = D:20;C:40;B:52;A:61;S:76

# Shots kept in the inventory (topped up on login, respawn and grade change).
# Fighters get Soulshots, mages get (Blessed) Spiritshots of the weapon grade.
# Default: 2000, 1000, True
RLSoulshotCount = 2000
RLSpiritshotCount = 1000
RLUseBlessedSpiritshots = True

# Arrows of the bow's grade for bow users (the server equips them when the bow attacks). Arrows
# of other grades are destroyed: an arrow weighs 4-6, so more than about 3000 overloads an agent.
# Default: 3000
RLArrowCount = 3000

# Death penalties for agents: experience loss (and with it losing levels) and the Death Penalty
# debuff. Off, an agent keeps its level and stats however often it dies (a death is already a
# negative reward), and a Death Penalty it still carries is removed on login and respawn.
# Default: False
RLAgentDeathPenalty = False

# An agent that levels up is set back to the level it was created with (the level drawn from
# RLLevelMean / RLLevelStdDev) and moved to another farm area of that level: the level mix of the
# population stays as drawn, and agents see new places.
# Default: True
RLResetLevelOnLevelUp = True

# Items the agent's skills consume (summoning crystals, spirit ore ...): at least this many, or ten
# casts' worth. Agents with a servitor summon also get Beast Soulshots and Blessed Beast Spiritshots
# (used automatically, like their own shots).
# Default: 100, 1000
RLSkillItemCount = 100
RLBeastShotCount = 1000

# Enable automatic use of the granted shots.
# Default: True
RLAutoEnableShots = True

# Consumables kept in the inventory, topped up like the shots.
# Format: itemId:count;itemId:count
# 1061 = Healing Potion, 1539 = Greater Healing Potion
# Default: 1061:50;1539:50
RLConsumables = 1061:50;1539:50

# ---------------------------------------------------------------------------
# Farm zones, teleport and respawn
# ---------------------------------------------------------------------------

# Teleport agents to the farm zone of their level after the setup and on every login.
# Default: True, True
RLTeleportToFarmZone = True
RLTeleportOnLogin = True

# How a farm spot is chosen.
# auto: from the server's monster spawns. An agent of level L goes to a spawn territory
#       whose monsters are at most L + RLFarmLevelAbove and mostly at least
#       L - RLFarmLevelBelow, next to a live monster; each territory takes one agent per
#       RLFarmMobsPerAgent fitting monsters, so many agents spread over the map. An agent
#       keeps its territory while it still fits and moves on when a level-up outgrows it.
#       The RLFarmZones anchors below are the fallback when no territory fits.
# anchors: only the RLFarmZones anchors.
# Default: auto
RLFarmZoneMode = auto

# Monster level window of the auto mode, relative to the agent's level.
# Default: 2, 1
RLFarmLevelBelow = 2
RLFarmLevelAbove = 1

# A territory fits when at least this percent of its monsters (and at least
# RLFarmMinMonsters of them) lie in the window and none is above it.
# Default: 70, 4
RLFarmMinShare = 70
RLFarmMinMonsters = 4

# Fitting monsters per agent in one territory (its capacity). When every fitting
# territory is full, the least loaded one is used.
# Default: 5
RLFarmMobsPerAgent = 5

# Spawn folders (data/spawns/<folder>/) never used for farming.
# Default: Castles,Catacombs,SevenSigns
RLFarmExcludedSpawnFolders = Castles,Catacombs,SevenSigns

# Farm zone anchors per level bracket. Several anchors of one bracket are separated
# by "|", one is picked at random. "start" is the race's newbie start point.
# Format: minLevel-maxLevel:x,y,z|x,y,z;minLevel-maxLevel:...
# Anchors must stand on open ground: the agents have no pathfinding, so a spot ringed by
# cliffs (e.g. the western Wastelands, -47506,179572,-3632) leaves them stuck in the terrain.
# Default: 1-9 start, 10-19 Abandoned Camp, 20-34 Execution Ground,
#          35-49 Breka's Stronghold, 50-80 Dragon Valley
RLFarmZones = 1-9:start;10-19:-49853,147089,-2784;20-34:46165,150008,-3208;35-49:85546,131328,-3672;50-80:122824,110836,-3727

# Random offset (game units) around the anchor, so agents do not stack on one spot.
# Default: 150
RLFarmZoneSpread = 150

# Revive a dead agent in the farm zone of its level with full HP/MP/CP instead of
# sending it to town.
# Default: True
RLRespawnOnDeath = True

# Delay before the revive, in milliseconds.
# Default: 4000
RLRespawnDelay = 4000

# ---------------------------------------------------------------------------
# Buffs
# ---------------------------------------------------------------------------

# Every life (login, revive) an agent gets one buff set, picked with these weights:
#   none          no buffs
#   newbie        the Newbie Helper buffs (levels 8-25, see RLBuffNewbie); outside them
#                 another set is used
#   support       the buffs of one random support class (RLBuffSupport.<class>)
#   dances_songs  Swordsinger songs and Bladedancer dances
#   full          a full NPC buffer set (RLBuffFull)
# A buff is cast at the highest level whose magic level the agent has reached, as if a
# support of the same level cast it; a buff above the agent's level is left out. One
# buff per effect type is kept and a set is cut to the buff / dance slots.
# Default: none:15;newbie:20;support:30;dances_songs:15;full:20
RLBuffSetWeights = none:15;newbie:20;support:30;dances_songs:15;full:20

# Buff lists: skillId[:minLevel-maxLevel][:mage|fighter], separated by commas. A buff tagged
# fighter (physical attack, speed, accuracy, critical) is cast on fighters only, one tagged
# mage (casting power, speed, MP) on mages only; untagged ones (defence, run speed, HP) on both.
# Earlier entries win when two give the same effect (Greater Might before Might).
# Newbie Helper (handlers/bypass/npc/SupportMagic.java), without the Life Cubic.
RLBuffNewbie = 4322:8-24,4323:11-23,4328:12-22:mage,4329:13-21:mage,4330:14-20:mage,4331:15-19:mage,4324:12-22:fighter,4325:13-21:fighter,4326:14-20:fighter,4327:15-19:fighter

# Support classes: their buffs on others from the class skill trees (with the 3rd class
# ones), without the narrow resistances, Decrease Weight and invulnerabilities.
RLBuffSupport.Prophet = 1388:fighter,1389,1204,1086:fighter,1077:fighter,1242:fighter,1240:fighter,1062:fighter,1045,1048:mage,1036,1035,1085:mage,1078:mage,1073,1043:fighter,1032,1044,1243,1356:fighter,1068:fighter,1040
RLBuffSupport.ElvenElder = 1204,1040,1068:fighter,1087:fighter,1073,1035,1044,1078:mage,1243,1303:mage,1259,1304,1397:mage,1043:fighter
RLBuffSupport.ShillienElder = 1204,1040,1068:fighter,1059:mage,1077:fighter,1073,1035,1240:fighter,1242:fighter,1078:mage,1303:mage,1268:fighter,1357:fighter
RLBuffSupport.Bishop = 1068:fighter,1073,1040,1077:fighter,1043:fighter,1035,1204,1078:mage,1085:mage,1044,1062:fighter,1311,1307
RLBuffSupport.Warcryer = 1003,1010,1005,1009,1007:fighter,1006,1252:fighter,1002,1253:fighter,1251:fighter,1309:fighter,1308:fighter,1229,1310:fighter,1390:fighter,1391,1284,1363:fighter,1413:fighter
RLBuffSupport.Overlord = 1006,1007:fighter,1009,1002,1229,1010,1003,1005,1261:fighter,1008:fighter,1250,1004:mage,1260:fighter,1249:fighter,1282:fighter,1364:fighter,1365:mage,1414:fighter,1416:fighter

# Songs and dances, interleaved so the 12 dance slots get both.
RLBuffDancesSongs = 271:fighter,264,275:fighter,268,274:fighter,267,269:fighter,304,273:mage,276:mage,272,265,277,266,310:fighter,305,270,311,306,307,308,309,365:mage,366:fighter

# Full buff: the Prophet buffs, the best of the Elders, then songs and dances.
RLBuffFull = 1388:fighter,1389,1204,1086:fighter,1077:fighter,1242:fighter,1240:fighter,1062:fighter,1045,1048:mage,1036,1035,1085:mage,1078:mage,1073,1043:fighter,1032,1044,1243,1356:fighter,1068:fighter,1040,1303:mage,1059:mage,1087:fighter,1397:mage,1268:fighter,271:fighter,264,275:fighter,268,274:fighter,267,269:fighter,304,273:mage,276:mage,272,265,277,266,310:fighter,305,270,311,306,307,308,309,365:mage,366:fighter

# Expired buffs of the current set are recast this often (milliseconds of server time).
# 0 = only on login and revive.
# Default: 30000
RLBuffRefreshInterval = 30000

# Buff potions from the shops, given and topped up like the shots; the actor drinks one when no
# buff of the same kind (run speed, attack speed, casting speed) is on the character.
# Format: itemId[:minLevel-maxLevel][:mage|fighter], separated by commas.
# Haste (734/1374): run speed; Alacrity / Greater Swift Attack (735/1375): attack speed;
# (Greater) Magic Haste (6035/6036): casting speed.
# Default: 734:1-39,1374:40-80,735:1-39:fighter,1375:40-80:fighter,6035:1-39:mage,6036:40-80:mage, 20
RLBuffPotions = 734:1-39,1374:40-80,735:1-39:fighter,1375:40-80:fighter,6035:1-39:mage,6036:40-80:mage
RLBuffPotionCount = 20

# ---------------------------------------------------------------------------
# Support class builds
# ---------------------------------------------------------------------------

# How a support class plays solo; one build per character, picked with these weights
# (name:weight;...). The build decides the equipment, the buffs (mage or fighter) and,
# for undead hunters, the farm areas.
#   undead_mage  magic weapon + robe, mage buffs, areas where undead are the majority
#                (Prophets, Elders and Bishops are strong casters only against undead)
#   caster       magic weapon + robe, mage buffs, any monsters (Warcryer / Overlord drains)
#   melee_heavy  one-handed blunt + shield + heavy armor, fighter buffs
#   melee_light  one-handed blunt + shield + light armor, fighter buffs
# Families: Prophet (and Hierophant); Elder (Cleric, Bishop, Elven / Shillien Oracle and
# Elder and their 3rd classes); Shaman (Orc Shaman, Warcryer, Overlord and 3rd classes).
# Default: see the values
RLBuilds.Prophet = undead_mage:40;melee_heavy:30;melee_light:30
RLBuilds.Elder = undead_mage:70;melee_light:30
RLBuilds.Shaman = caster:60;melee_heavy:40

# Undead hunting starts at this level (there are hardly any undead areas below it).
# Default: 30
RLUndeadMinLevel = 30

# An undead hunter of level L takes areas whose monsters are at most L + RLFarmLevelAbove and
# where at least RLFarmUndeadMinShare percent of the monsters from L - RLFarmUndeadLevelBelow
# upwards are undead.
# Default: 5, 50
RLFarmUndeadLevelBelow = 5
RLFarmUndeadMinShare = 50
